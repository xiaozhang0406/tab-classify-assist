<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IceCola Tab Grouper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title-row">
      <h1>标签页分组器</h1>
      <span class="badge" id="stat-total">0 标签</span>
    </div>
    <p id="last-grouping">尚未分组</p>
  </header>

  <!-- 实时概览状态卡片 -->
  <section class="stats-card">
    <div class="stat-item">
      <span class="stat-val" id="stat-grouped">0</span>
      <span class="stat-lbl">已分组</span>
    </div>
    <div class="stat-item">
      <span class="stat-val" id="stat-groups">0</span>
      <span class="stat-lbl">分组数</span>
    </div>
    <div class="stat-item">
      <span class="stat-val" id="stat-duplicates">0</span>
      <span class="stat-lbl">重复项</span>
    </div>
    <div class="stat-item">
      <span class="stat-val" id="stat-windows">1</span>
      <span class="stat-lbl">窗口数</span>
    </div>
  </section>

  <!-- 核心操作按钮组 -->
  <button id="btn-group" class="primary">一键智能分组 <span class="shortcut-tip">Alt+Shift+G</span></button>
  <div class="btn-row">
    <button id="btn-dedup" class="secondary">去重标签 <span class="shortcut-tip">Alt+Shift+D</span></button>
    <button id="btn-ungroup" class="secondary danger">一键解散</button>
  </div>

  <!-- 当前活动标签组管理卡片 -->
  <section class="live-groups-section" id="live-groups-section">
    <div class="section-header">
      <h2>当前窗口标签组</h2>
      <div class="header-btns">
        <button id="btn-discard-all" class="text-btn cool-btn" title="休眠当前所有后台标签组以释放内存">❄️ 休眠后台组</button>
        <button id="btn-refresh-groups" class="text-btn">刷新</button>
      </div>
    </div>
    <div id="live-groups-list"><p class="empty-hint">当前窗口尚无标签分组</p></div>
  </section>

  <!-- 偏好设置面板 -->
  <details class="settings-accordion">
    <summary>⚙️ 整理偏好与规则设置</summary>
    <section class="settings">
      <div class="row">
        <label for="auto-group-enabled">开启后台自动整理</label>
        <input type="checkbox" id="auto-group-enabled" checked />
      </div>
      <div class="row">
        <label for="interval">自动整理间隔（分钟）</label>
        <input type="number" id="interval" min="1" max="120" />
      </div>
      <div class="row">
        <label for="min-tabs">同域名建组阈值（标签数）</label>
        <input type="number" id="min-tabs" min="2" max="10" />
      </div>
      <div class="row">
        <label for="use-root-domain">按主域名聚合 (如 bilibili.com)</label>
        <input type="checkbox" id="use-root-domain" checked />
      </div>
      <div class="row">
        <label for="use-friendly-names">启用站点中文别名 (如 B站、知乎)</label>
        <input type="checkbox" id="use-friendly-names" checked />
      </div>
      <div class="row">
        <label for="merge-windows">整理前合并所有窗口</label>
        <input type="checkbox" id="merge-windows" />
      </div>
      <div class="row">
        <label for="auto-collapse">分组后自动折叠</label>
        <input type="checkbox" id="auto-collapse" />
      </div>
      <div class="column">
        <label for="custom-aliases">自定义别名映射（例如 work.com:工作, blog.me:博客）</label>
        <input type="text" id="custom-aliases" placeholder="work.com:工作, mycorp.cn:内网" />
      </div>
      <div class="column">
        <label for="excluded-domains">排除域名（逗号分隔，如 localhost, *.internal.com）</label>
        <input type="text" id="excluded-domains" placeholder="localhost, 127.0.0.1" />
      </div>
      <div class="settings-footer">
        <span id="settings-status" class="settings-status"></span>
        <button id="btn-save-settings" class="ghost">保存设置</button>
      </div>
    </section>
  </details>

  <!-- 历史会话快照与恢复 -->
  <section id="session-list">
    <div class="section-header">
      <h2>历史会话快照</h2>
      <button id="btn-clear-sessions" class="text-btn">清空</button>
    </div>
    <div id="sessions"><p class="empty">暂无记录，点"一键智能分组"开始</p></div>
  </section>

  <footer>由冰可乐自研 · v2.2.0</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
